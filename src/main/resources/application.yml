server:
  port: 8080

spring:
  application:
    name: deployhub

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:deployhub}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:deployhub}
    password: ${DB_PASSWORD:deployhub}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 스키마는 Flyway가 관리한다. Hibernate는 검증만 수행하고 DDL을 생성하지 않는다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Phase 1 범위 설정값. 이후 Phase에서 registry/graph/job 관련 값이 추가된다.
deployhub:
  work-dir: ${WORK_DIR:/data/deployhub/jobs}
  cors:
    # 프론트엔드가 별도 오리진에서 호출한다 (구현계획서 0.3·0.6절). 쉼표로 여러 값 허용.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

logging:
  level:
    com.deployhub: INFO
