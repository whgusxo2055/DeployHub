server:
  port: 8080

spring:
  application:
    name: deployhub

  # NCR/Graph 호출이 무기한 대기하지 않도록 한다 — 없으면 StartupChecks가 VPC 오설정 시
  # 무한 대기하고, health endpoint 하나가 워커 스레드를 영구 점유할 수 있다.
  http:
    client:
      connect-timeout: 5s
      read-timeout: 10s

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:deployhub}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:deployhub}
    password: ${DB_PASSWORD:deployhub}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 스키마는 Flyway가 관리한다. Hibernate는 검증만 수행하고 DDL을 생성하지 않는다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

deployhub:
  work-dir: ${WORK_DIR:/data/deployhub/jobs}

  # 기동 시 NCR 도달성을 확인한다(StartupChecks). 실제 키/네트워크 없이 Swagger만 보려면
  # `dev` 프로필(application-dev.yml)로 끌 것 — 기본값은 항상 true.
  startup-checks:
    enabled: ${STARTUP_CHECKS_ENABLED:true}
  cors:
    # 프론트엔드가 별도 오리진에서 호출한다 (구현계획서 0.3·0.6절). 쉼표로 여러 값 허용.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

  # Phase 2 — FN-04-1 NCP Container Registry. Public Endpoint 사용 — 패키징 서버가 VPC
  # 밖이어도 아웃바운드 443만 열리면 도달 가능하다. 인증은 Access Key Id/Secret Key
  # Basic (docker login과 동일한 자격 증명).
  registry:
    endpoint: ${NCR_ENDPOINT:}
    access-key: ${NCR_ACCESS_KEY:}
    secret-key: ${NCR_SECRET_KEY:}
    cli-path: ${NCR_CLI_PATH:/usr/bin/skopeo}

  # Phase 2 — FN-04-5 Microsoft Graph / SharePoint. SP_DRIVE_ID를 비워두면 사이트의
  # 기본 문서 라이브러리를 조회해 대신 사용한다.
  sharepoint:
    tenant-id: ${GRAPH_TENANT_ID:}
    client-id: ${GRAPH_CLIENT_ID:}
    client-secret: ${GRAPH_CLIENT_SECRET:}
    site-id: ${SP_SITE_ID:}
    drive-id: ${SP_DRIVE_ID:}
    root-path: ${SP_ROOT_PATH:/Deploy/Packages}

  # Phase 2 — 이후 모든 외부 호출(NCR·Graph)이 공유하는 재시도 정책 (0.6절).
  retry:
    max-retries: ${MAX_RETRY:3}
    backoff: ${RETRY_BACKOFF:5,15}

  # Phase 3 — Job 오케스트레이션 (0.6절 JOB_CONCURRENCY). 확정 시점 디스크 여유 공간
  # 경고 기준은 기본 50GiB — 실제 필요 용량은 Phase 4가 매니페스트 크기로 계산한다.
  job:
    concurrency: ${JOB_CONCURRENCY:3}
    min-free-disk-bytes: ${MIN_FREE_DISK_BYTES:53687091200}

  # Phase 4 — FN-06-1 다운로드. downloadExecutor 풀 크기는 JOB_CONCURRENCY ×
  # download.concurrency (0.6절 "Job 3건 × 아이템 3건 = skopeo 최대 9개 동시" 근거).
  download:
    concurrency: ${DOWNLOAD_CONCURRENCY:3}
    skopeo-timeout: ${SKOPEO_TIMEOUT:1800}

  # Phase 5 — FN-09 업로드. 320 KiB(327680)의 배수여야 한다 — 아니면 기동이 실패한다
  # (E-1108, StartupChecks).
  upload:
    chunk-size: ${UPLOAD_CHUNK_SIZE:10485760}

  # Phase 6 — FN-11 보존·정리 배치 (0.6절). days/count는 SharePoint 폴더,
  # local-cleanup-delay-hours는 중계 서버 작업 디렉터리에 적용된다. cron은 0.6절 설정값
  # 표에 없어 env var로 노출하지 않는다 — 바꿀 일이 생기면 그때 꺼낸다.
  retention:
    days: ${RETENTION_DAYS:90}
    count: ${RETENTION_COUNT:10}
    local-cleanup-delay-hours: ${LOCAL_CLEANUP_DELAY_HOURS:24}
    cron: "0 0 3 * * *"

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

logging:
  level:
    com.deployhub: INFO
