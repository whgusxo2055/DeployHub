# 실제 NCR/Graph 키 없이도 앱을 띄우는 프로필. 자격 증명 @NotBlank 검증만 통과시키는
# 더미 값을 채우고, 기동 시 NCR 도달성 확인(StartupChecks)을 끈다.
#
# 용도 1 — Swagger 명세만 확인/공유: /swagger-ui.html, /v3/api-docs
#   사용법: gradlew bootRun --args='--spring.profiles.active=dev'
#           (또는 SPRING_PROFILES_ACTIVE=dev 환경변수)
# 용도 2 — Testcontainers 통합 테스트(MySqlContainerSupport)가 NCR/Graph를 타지 않는
#   흐름을 검증할 때 전체 컨텍스트를 띄우는 데 재사용한다 — 여기 값을 바꾸면(ddl-auto,
#   flyway 설정 등) 그 테스트들도 영향을 받는다.
#
# 주의: 이 프로필로 뜬 인스턴스는 /api/health/*, 실제 패키징(Job) 관련 기능이 전부 실패한다
# (더미 값이라 진짜 NCR/Graph에 붙지 않음). 운영 배포에는 쓰지 말 것.
#
# registry/sharepoint는 하드코딩이 아니라 env var 기본값 패턴(${NCR_ENDPOINT:placeholder})이다 —
# 실 자격증명이 준비되면 코드 변경 없이 그 env var만 채워 dev 프로필로도 실제 연동을 시험할 수 있다.
deployhub:
  startup-checks:
    enabled: false
  # 로컬/테스트에는 /data/deployhub/jobs가 없다 — 빌드 디렉터리 아래로 돌려 디스크 확인이 통과하게 한다.
  work-dir: ./build/tmp/deployhub-jobs
  registry:
    # 더미 자격증명으로는 매니페스트 조회가 타임아웃뿐이라 등록마다 재시도 백오프를 다 태운다.
    # 실 자격증명을 넣고 dev로 띄울 때는 env var(REGISTRY_VERIFY_ON_REGISTER=true)로 되살릴 것.
    verify-on-register: ${REGISTRY_VERIFY_ON_REGISTER:false}
    endpoint: ${NCR_ENDPOINT:placeholder.invalid}
    access-key: ${NCR_ACCESS_KEY:placeholder}
    secret-key: ${NCR_SECRET_KEY:placeholder}
  sharepoint:
    tenant-id: ${GRAPH_TENANT_ID:placeholder}
    client-id: ${GRAPH_CLIENT_ID:placeholder}
    client-secret: ${GRAPH_CLIENT_SECRET:placeholder}
    site-id: ${SP_SITE_ID:placeholder}
